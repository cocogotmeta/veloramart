<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VELORA MART | Premium Lifestyle & Electronics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            accent: '#6366F1',
                            glow: '#818CF8',
                            pink: '#F43F5E',
                            dark: '#090D16',
                            card: '#111827',
                            border: '#1F2937'
                        }
                    },
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        .glass-card { background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .glow-effect { box-shadow: 0 0 25px -5px rgba(99, 102, 241, 0.4); }
        .hide-scroll::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-brand-dark text-slate-100 font-sans antialiased selection:bg-brand-accent selection:text-white">

    <!-- Top Announcement Bar -->
    <div class="bg-gradient-to-r from-indigo-900 via-purple-900 to-pink-900 text-slate-200 text-xs font-semibold py-2.5 px-4 text-center border-b border-white/10 tracking-wider">
        🚀 FAST SHIPPING ACROSS PAKISTAN • CASH ON DELIVERY AVAILABLE ⚡
    </div>

    <!-- Header / Navbar -->
    <header class="sticky top-0 z-40 bg-brand-dark/80 backdrop-blur-xl border-b border-brand-border">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 py-4 flex items-center justify-between gap-4">
            <a href="#" class="text-2xl font-black tracking-wider flex items-center gap-2.5 group">
                <div class="bg-gradient-to-br from-brand-accent to-brand-pink p-2 rounded-xl text-white group-hover:scale-105 transition-transform shadow-lg shadow-brand-accent/30">
                    <i class="fa-solid fa-bolt-lightning text-lg"></i>
                </div>
                <span class="bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">VELORA</span><span class="text-brand-accent">.</span>
            </a>

            <!-- Search Bar -->
            <div class="flex-1 max-w-md hidden md:block">
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                    <input type="text" id="searchInput" oninput="handleSearch()" placeholder="Search from 500+ products..." 
                        class="w-full bg-slate-900/90 border border-brand-border rounded-full py-2.5 pl-10 pr-4 text-xs font-medium text-slate-200 placeholder-slate-500 focus:outline-none focus:border-brand-accent focus:ring-1 focus:ring-brand-accent transition-all">
                </div>
            </div>

            <!-- Cart Trigger -->
            <button onclick="toggleCart()" class="relative flex items-center gap-3 bg-slate-900 hover:bg-slate-800 border border-brand-border text-slate-200 px-5 py-2.5 rounded-full font-bold text-xs transition-all glow-effect">
                <i class="fa-solid fa-bag-shopping text-brand-accent text-sm"></i>
                <span>Cart</span>
                <span id="cartBadge" class="bg-brand-pink text-white text-[10px] font-black rounded-full h-5 w-5 flex items-center justify-center">0</span>
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 py-8 space-y-10">
        
        <!-- Hero Banner -->
        <div class="relative rounded-3xl overflow-hidden glass-card p-8 sm:p-14 border border-white/10 shadow-2xl">
            <div class="absolute -top-24 -right-24 w-96 h-96 bg-brand-accent/20 rounded-full blur-3xl pointer-events-none"></div>
            <div class="relative z-10 max-w-xl space-y-5">
                <span class="inline-flex items-center gap-2 bg-brand-accent/10 border border-brand-accent/30 text-brand-glow text-xs font-bold px-3 py-1 rounded-full uppercase tracking-widest">
                    <i class="fa-solid fa-fire text-brand-pink"></i> Mega Catalog (500 Items)
                </span>
                <h1 class="text-3xl sm:text-5xl font-black text-white leading-tight">Elevate Your Everyday Essentials.</h1>
                <p class="text-slate-400 text-xs sm:text-sm leading-relaxed">Discover top-tier tech, grooming gear, and fashion essentials crafted for performance.</p>
            </div>
        </div>

        <!-- Filter Categories -->
        <div class="flex items-center gap-3 overflow-x-auto pb-2 hide-scroll" id="categoryFilters">
            <button onclick="filterCategory('All')" class="cat-btn active bg-brand-accent text-white text-xs font-extrabold px-5 py-2.5 rounded-full whitespace-nowrap shadow-lg shadow-brand-accent/25 transition-all">All Products</button>
            <button onclick="filterCategory('Electronics')" class="cat-btn bg-slate-900 text-slate-400 border border-brand-border hover:text-white text-xs font-bold px-5 py-2.5 rounded-full whitespace-nowrap transition-all">Electronics</button>
            <button onclick="filterCategory('Grooming')" class="cat-btn bg-slate-900 text-slate-400 border border-brand-border hover:text-white text-xs font-bold px-5 py-2.5 rounded-full whitespace-nowrap transition-all">Grooming</button>
            <button onclick="filterCategory('Fashion')" class="cat-btn bg-slate-900 text-slate-400 border border-brand-border hover:text-white text-xs font-bold px-5 py-2.5 rounded-full whitespace-nowrap transition-all">Fashion</button>
        </div>

        <!-- Product Grid -->
        <div id="productsGrid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-5">
            <!-- Dynamic Injection -->
        </div>

        <!-- Load More Section -->
        <div class="text-center pt-6">
            <button id="loadMoreBtn" onclick="loadMoreProducts()" class="px-8 py-3.5 bg-slate-900 hover:bg-brand-accent border border-brand-border hover:border-brand-accent text-white font-extrabold text-xs rounded-xl shadow-lg transition-all">
                Load More Products
            </button>
        </div>

    </main>

    <!-- Cart Drawer -->
    <div id="cartModal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex justify-end">
        <div class="bg-brand-card border-l border-brand-border w-full max-w-md h-full flex flex-col shadow-2xl">
            <div class="p-5 bg-slate-900/80 border-b border-brand-border flex justify-between items-center">
                <h3 class="font-extrabold text-base text-white flex items-center gap-2">
                    <i class="fa-solid fa-bag-shopping text-brand-accent"></i> Your Cart
                </h3>
                <button onclick="toggleCart()" class="text-slate-400 hover:text-white transition-colors">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>

            <div id="cartItems" class="flex-1 overflow-y-auto p-5 space-y-3"></div>

            <div class="p-5 border-t border-brand-border bg-slate-900/50 space-y-4">
                <div class="flex justify-between font-black text-white text-lg">
                    <span>Total Amount:</span>
                    <span id="cartTotal" class="text-brand-accent">Rs. 0</span>
                </div>
                
                <form id="checkoutForm" onsubmit="processOrder(event)" class="space-y-3">
                    <input type="text" id="custName" placeholder="Full Name" required 
                        class="w-full text-xs p-3.5 bg-slate-900 border border-brand-border text-white rounded-xl focus:outline-none focus:border-brand-accent transition-all">
                    <input type="tel" id="custPhone" placeholder="Phone / WhatsApp Number" required 
                        class="w-full text-xs p-3.5 bg-slate-900 border border-brand-border text-white rounded-xl focus:outline-none focus:border-brand-accent transition-all">
                    <textarea id="custAddress" placeholder="Complete Delivery Address" required 
                        class="w-full text-xs p-3.5 bg-slate-900 border border-brand-border text-white rounded-xl focus:outline-none focus:border-brand-accent transition-all h-20 resize-none"></textarea>
                    
                    <button type="submit" class="w-full py-4 bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold rounded-xl text-xs uppercase tracking-wider shadow-lg shadow-emerald-600/30 transition-all flex items-center justify-center gap-2.5">
                        <i class="fa-brands fa-whatsapp text-lg"></i> Confirm Order On WhatsApp
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script>
        let products = [];
        let filteredProducts = [];
        let cart = [];
        let currentPage = 1;
        const itemsPerPage = 20;

        // Auto Generate 500 Premium Products
        function generate500Products() {
            const categories = ["Electronics", "Grooming", "Fashion"];
            const images = {
                Electronics: [
                    "https://images.unsplash.com/photo-1590658268037-6bf12165a8df?w=500",
                    "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500",
                    "https://images.unsplash.com/photo-1587829741301-dc798b83add3?w=500",
                    "https://images.unsplash.com/photo-1527864550417-7fd91fc51a46?w=500"
                ],
                Grooming: [
                    "https://images.unsplash.com/photo-1621607512214-68297480165e?w=500",
                    "https://images.unsplash.com/photo-1585232351009-aa87416fca90?w=500",
                    "https://images.unsplash.com/photo-1535585209827-a15fcdbc4c2d?w=500"
                ],
                Fashion: [
                    "https://images.unsplash.com/photo-1556905055-8f358a7a47b2?w=500",
                    "https://images.unsplash.com/photo-1627123424574-724758594e93?w=500",
                    "https://images.unsplash.com/photo-1511499767150-a48a237f0083?w=500"
                ]
            };

            const titles = {
                Electronics: ["TWS Earbuds", "Smart Watch Ultra", "RGB Gaming Keyboard", "Wireless Gaming Mouse", "Fast Power Bank", "Bluetooth Speaker", "ANC Headphones", "Fast Charging Cable"],
                Grooming: ["Vintage T9 Hair Trimmer", "Double-Edge Safety Razor", "Barber Hair Clay Spray", "Shaving Brush Set", "Beard Grooming Kit", "Pro Hair Clipper", "Electric Face Scrubber"],
                Fashion: ["Urban Oversized Hoodie", "Luxury Leather Wallet", "UV Protection Sunglasses", "Minimalist Wrist Watch", "Cotton Streetwear Tee", "Denim Jacket", "Slim Fit Cargo Pants"]
            };

            let list = [];
            for (let i = 1; i <= 500; i++) {
                let cat = categories[i % 3];
                let titleBase = titles[cat][i % titles[cat].length];
                let imgList = images[cat];
                let price = Math.floor(Math.random() * 4000) + 999;
                let origPrice = price + Math.floor(Math.random() * 1500) + 500;
                let disc = Math.round(((origPrice - price) / origPrice) * 100) + "% OFF";

                list.push({
                    id: i,
                    title: `${titleBase} Edition #${i}`,
                    category: cat,
                    price: price,
                    original_price: origPrice,
                    discount: disc,
                    image_url: imgList[i % imgList.length]
                });
            }
            return list;
        }

        document.addEventListener("DOMContentLoaded", () => {
            products = generate500Products();
            filteredProducts = [...products];
            renderProducts();
        });

        function renderProducts(append = false) {
            const grid = document.getElementById("productsGrid");
            const end = currentPage * itemsPerPage;
            const itemsToRender = filteredProducts.slice(0, end);

            if (itemsToRender.length === 0) {
                grid.innerHTML = `<p class="col-span-full text-center py-16 text-slate-500 font-medium text-xs">No products found in this category.</p>`;
                document.getElementById("loadMoreBtn").style.display = "none";
                return;
            }

            grid.innerHTML = itemsToRender.map(p => `
                <div class="glass-card rounded-2xl p-3.5 border border-brand-border flex flex-col justify-between group hover:border-brand-accent/50 transition-all duration-300">
                    <div>
                        <div class="relative h-44 overflow-hidden rounded-xl mb-3 bg-slate-900/50">
                            <img src="${p.image_url}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500">
                            ${p.discount ? `<span class="absolute top-2.5 left-2.5 bg-brand-pink text-white text-[9px] font-black px-2 py-0.5 rounded-full uppercase tracking-wider">${p.discount}</span>` : ''}
                        </div>
                        <span class="text-[9px] font-extrabold text-brand-glow uppercase tracking-widest">${p.category}</span>
                        <h4 class="text-xs font-bold text-slate-200 line-clamp-2 mt-1 group-hover:text-white transition-colors">${p.title}</h4>
                    </div>
                    <div class="mt-4">
                        <div class="flex items-baseline gap-1.5 mb-3">
                            <span class="text-base font-black text-white">Rs. ${p.price}</span>
                            <span class="text-[11px] text-slate-500 line-through">Rs. ${p.original_price}</span>
                        </div>
                        <button onclick="addToCart(${p.id})" class="w-full py-2.5 bg-slate-900 hover:bg-brand-accent text-white text-xs font-extrabold rounded-xl transition-all border border-brand-border hover:border-brand-accent flex items-center justify-center gap-2 shadow-sm">
                            <i class="fa-solid fa-plus text-[10px]"></i> Add To Cart
                        </button>
                    </div>
                </div>
            `).join("");

            if (end >= filteredProducts.length) {
                document.getElementById("loadMoreBtn").style.display = "none";
            } else {
                document.getElementById("loadMoreBtn").style.display = "inline-block";
            }
        }

        function loadMoreProducts() {
            currentPage++;
            renderProducts();
        }

        function toggleCart() {
            document.getElementById("cartModal").classList.toggle("hidden");
        }

        function addToCart(id) {
            const prod = products.find(p => p.id === id);
            const found = cart.find(c => c.id === id);
            if (found) found.qty++;
            else cart.push({ ...prod, qty: 1 });
            updateCart();
            toggleCart();
        }

        function updateCart() {
            document.getElementById("cartBadge").innerText = cart.reduce((a, b) => a + b.qty, 0);
            const total = cart.reduce((a, b) => a + (b.price * b.qty), 0);
            document.getElementById("cartTotal").innerText = `Rs. ${total.toLocaleString()}`;

            const container = document.getElementById("cartItems");
            if (cart.length === 0) {
                container.innerHTML = `<div class="text-center py-20 space-y-3"><i class="fa-solid fa-bag-shopping text-4xl text-slate-700"></i><p class="text-slate-500 text-xs font-medium">Your shopping bag is empty.</p></div>`;
                return;
            }

            container.innerHTML = cart.map(i => `
                <div class="flex items-center justify-between bg-slate-900/60 p-3.5 rounded-xl border border-brand-border">
                    <div class="space-y-0.5">
                        <h5 class="text-xs font-bold text-slate-200">${i.title}</h5>
                        <p class="text-[11px] font-semibold text-brand-glow">Rs. ${i.price} x ${i.qty}</p>
                    </div>
                    <span class="text-xs font-black text-white">Rs. ${i.price * i.qty}</span>
                </div>
            `).join("");
        }

        function processOrder(e) {
            e.preventDefault();
            if (cart.length === 0) return alert("Your cart is empty!");

            const name = document.getElementById("custName").value;
            const phone = document.getElementById("custPhone").value;
            const address = document.getElementById("custAddress").value;
            const total = cart.reduce((a, b) => a + (b.price * b.qty), 0);

            let orderList = cart.map(i => `• ${i.title} (x${i.qty}) - Rs. ${i.price * i.qty}`).join('\n');
            
            let message = `*NEW ORDER - VELORA MART*\n\n` +
                          `*Customer Name:* ${name}\n` +
                          `*Phone Number:* ${phone}\n` +
                          `*Delivery Address:* ${address}\n\n` +
                          `*Order Items:*\n${orderList}\n\n` +
                          `*Total Bill:* Rs. ${total}`;

            let myNumber = "923234749637"; 
            let whatsappUrl = `https://wa.me/${myNumber}?text=${encodeURIComponent(message)}`;
            
            window.open(whatsappUrl, '_blank');
        }

        function handleSearch() {
            const q = document.getElementById("searchInput").value.toLowerCase();
            currentPage = 1;
            filteredProducts = products.filter(p => p.title.toLowerCase().includes(q) || p.category.toLowerCase().includes(q));
            renderProducts();
        }

        function filterCategory(cat) {
            document.querySelectorAll('.cat-btn').forEach(b => {
                b.classList.remove('bg-brand-accent', 'text-white', 'shadow-lg');
                b.classList.add('bg-slate-900', 'text-slate-400');
            });
            event.target.classList.add('bg-brand-accent', 'text-white', 'shadow-lg');
            event.target.classList.remove('bg-slate-900', 'text-slate-400');

            currentPage = 1;
            if (cat === 'All') filteredProducts = [...products];
            else filteredProducts = products.filter(p => p.category === cat);
            
            renderProducts();
        }
    </script>
</body>
</html>
