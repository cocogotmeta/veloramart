<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velora Mart | Premium Online Shopping</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { brand: { primary: '#6366F1', secondary: '#F43F5E', dark: '#0F172A', light: '#F8FAFC' } },
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] }
                }
            }
        }
    </script>
</head>
<body class="bg-brand-light text-slate-800 font-sans antialiased">

    <!-- Announcement Bar -->
    <div class="bg-gradient-to-r from-brand-primary to-brand-secondary text-white text-xs font-semibold py-2 px-4 text-center tracking-wide">
        ✨ Mega Sale Is Live! Free Home Delivery On Orders Over Rs. 2,000 ✨
    </div>

    <!-- Header -->
    <header class="bg-white/80 backdrop-blur-md sticky top-0 z-40 border-b border-slate-100 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-4">
            <a href="#" class="text-2xl font-extrabold text-brand-dark tracking-tight flex items-center gap-2">
                <span class="bg-brand-primary text-white p-2 rounded-xl text-lg flex items-center justify-center h-9 w-9">
                    <i class="fa-solid fa-bolt"></i>
                </span>
                VELORA<span class="text-brand-primary">MART</span>
            </a>

            <div class="flex-1 max-w-lg hidden sm:block">
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                    <input type="text" id="searchInput" oninput="handleSearch()" placeholder="Search trending products..." 
                        class="w-full bg-slate-100 border border-slate-200 rounded-full py-2 pl-10 pr-4 text-xs font-medium focus:outline-none focus:border-brand-primary focus:bg-white transition-all">
                </div>
            </div>

            <button onclick="toggleCart()" class="relative flex items-center gap-2.5 bg-brand-primary/10 text-brand-primary px-4 py-2 rounded-full font-bold text-xs hover:bg-brand-primary hover:text-white transition-all">
                <i class="fa-solid fa-bag-shopping text-sm"></i>
                <span>Cart</span>
                <span id="cartBadge" class="bg-brand-secondary text-white text-[10px] font-black rounded-full h-5 w-5 flex items-center justify-center">0</span>
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 py-8 space-y-8">
        
        <!-- Hero Banner -->
        <div class="relative rounded-3xl overflow-hidden bg-gradient-to-r from-brand-dark via-slate-900 to-indigo-950 text-white p-8 sm:p-12 shadow-xl">
            <div class="relative z-10 max-w-md space-y-4">
                <span class="inline-block bg-brand-secondary/20 text-brand-secondary border border-brand-secondary/30 px-3 py-1 rounded-full text-[11px] font-bold tracking-wider uppercase">Exclusive Collection</span>
                <h1 class="text-3xl sm:text-4xl font-black leading-tight">Upgrade Your Style & Gadgets Today</h1>
                <p class="text-slate-300 text-xs sm:text-sm">Explore top-rated electronics, grooming gear, and daily essentials at unbeatable prices.</p>
            </div>
            <div class="absolute right-0 top-0 bottom-0 w-1/2 opacity-20 bg-[radial-gradient(#6366f1_1px,transparent_1px)] [background-size:16px_16px]"></div>
        </div>

        <!-- Filter Categories -->
        <div class="flex items-center gap-2 overflow-x-auto pb-2 scrollbar-none" id="categoryFilters">
            <button onclick="filterCategory('All')" class="cat-btn active bg-brand-dark text-white text-xs font-bold px-4 py-2 rounded-full whitespace-nowrap shadow-sm">All Products</button>
            <button onclick="filterCategory('Electronics')" class="cat-btn bg-white text-slate-600 border border-slate-200 text-xs font-bold px-4 py-2 rounded-full whitespace-nowrap hover:bg-slate-50">Electronics</button>
            <button onclick="filterCategory('Grooming')" class="cat-btn bg-white text-slate-600 border border-slate-200 text-xs font-bold px-4 py-2 rounded-full whitespace-nowrap hover:bg-slate-50">Grooming</button>
            <button onclick="filterCategory('Fashion')" class="cat-btn bg-white text-slate-600 border border-slate-200 text-xs font-bold px-4 py-2 rounded-full whitespace-nowrap hover:bg-slate-50">Fashion</button>
        </div>

        <!-- Product Grid -->
        <div id="productsGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-4 gap-5">
            <!-- Dynamic Injection -->
        </div>
    </main>

    <!-- Cart Drawer -->
    <div id="cartModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex justify-end">
        <div class="bg-white w-full max-w-md h-full flex flex-col shadow-2xl">
            <div class="p-5 bg-brand-dark text-white flex justify-between items-center">
                <h3 class="font-extrabold text-base flex items-center gap-2"><i class="fa-solid fa-bag-shopping text-brand-primary"></i> Shopping Cart</h3>
                <button onclick="toggleCart()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>

            <div id="cartItems" class="flex-1 overflow-y-auto p-5 space-y-3"></div>

            <div class="p-5 border-t bg-slate-50 space-y-4">
                <div class="flex justify-between font-black text-slate-900 text-lg">
                    <span>Total Bill:</span>
                    <span id="cartTotal" class="text-brand-primary">Rs. 0</span>
                </div>
                
                <form id="checkoutForm" onsubmit="processOrder(event)" class="space-y-3">
                    <input type="text" id="custName" placeholder="Full Name" required class="w-full text-xs p-3 border border-slate-200 rounded-xl focus:outline-none focus:border-brand-primary">
                    <input type="tel" id="custPhone" placeholder="Phone / WhatsApp Number" required class="w-full text-xs p-3 border border-slate-200 rounded-xl focus:outline-none focus:border-brand-primary">
                    <textarea id="custAddress" placeholder="Complete Delivery Address" required class="w-full text-xs p-3 border border-slate-200 rounded-xl focus:outline-none focus:border-brand-primary h-20"></textarea>
                    
                    <button type="submit" id="submitBtn" class="w-full py-3.5 bg-gradient-to-r from-brand-primary to-indigo-600 hover:from-indigo-600 hover:to-brand-primary text-white font-extrabold rounded-xl text-xs uppercase tracking-wider shadow-lg shadow-brand-primary/25 transition-all">
                        Confirm Order
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://qyoqjauamgiwmitaznac.supabase.co";
        const SUPABASE_ANON_KEY = "EyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF5b3FqYXVhbWdpd21pdGF6bmFjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyMzMzODksImV4cCI6MjEwMjgwOTM4OX0.jHvI3shx3Vlo028912hmBkhMtYjGO2DUnSyaExSSKGQ";

        const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let products = [];
        let cart = [];

        // Preset High-Quality Trending Products
        const defaultProducts = [
            { id: 101, title: "Wireless TWS Earbuds Pro Max", category: "Electronics", price: 2499, original_price: 3999, discount: "38% OFF", image_url: "https://images.unsplash.com/photo-1590658268037-6bf12165a8df?w=500" },
            { id: 102, title: "Smart Watch Ultra Series 9", category: "Electronics", price: 4200, original_price: 5999, discount: "30% OFF", image_url: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500" },
            { id: 103, title: "Vintage T9 Barber Hair Trimmer", category: "Grooming", price: 1850, original_price: 2500, discount: "26% OFF", image_url: "https://images.unsplash.com/photo-1621607512214-68297480165e?w=500" },
            { id: 104, title: "Classic Double-Edge Safety Razor", category: "Grooming", price: 1299, original_price: 1800, discount: "28% OFF", image_url: "https://images.unsplash.com/photo-1585232351009-aa87416fca90?w=500" },
            { id: 105, title: "Urban Oversized Streetwear Hoodie", category: "Fashion", price: 2999, original_price: 4500, discount: "33% OFF", image_url: "https://images.unsplash.com/photo-1556905055-8f358a7a47b2?w=500" },
            { id: 106, title: "RGB Mechanical Gaming Keyboard", category: "Electronics", price: 3800, original_price: 5000, discount: "24% OFF", image_url: "https://images.unsplash.com/photo-1587829741301-dc798b83add3?w=500" }
        ];

        document.addEventListener("DOMContentLoaded", fetchProducts);

        async function fetchProducts() {
            const { data, error } = await db.from('products').select('*');
            if (error || !data || data.length === 0) {
                products = defaultProducts;
            } else {
                products = data;
            }
            renderProducts(products);
        }

        function renderProducts(items) {
            const grid = document.getElementById("productsGrid");
            if (items.length === 0) {
                grid.innerHTML = `<p class="col-span-full text-center py-10 text-slate-400 font-semibold text-sm">No products found in this category.</p>`;
                return;
            }

            grid.innerHTML = items.map(p => `
                <div class="bg-white rounded-2xl p-3 border border-slate-100 shadow-sm hover:shadow-md transition-all flex flex-col justify-between group">
                    <div>
                        <div class="relative h-40 overflow-hidden rounded-xl mb-3 bg-slate-50">
                            <img src="${p.image_url || 'https://via.placeholder.com/300'}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
                            ${p.discount ? `<span class="absolute top-2 left-2 bg-brand-secondary text-white text-[10px] font-black px-2 py-0.5 rounded-full uppercase">${p.discount}</span>` : ''}
                        </div>
                        <span class="text-[10px] font-bold text-brand-primary uppercase tracking-wider">${p.category || 'General'}</span>
                        <h4 class="text-xs font-bold text-slate-800 line-clamp-2 mt-0.5">${p.title}</h4>
                    </div>
                    <div class="mt-3">
                        <div class="flex items-baseline gap-1.5 mb-2">
                            <span class="text-base font-extrabold text-slate-900">Rs. ${p.price}</span>
                            ${p.original_price ? `<span class="text-xs text-slate-400 line-through">Rs. ${p.original_price}</span>` : ''}
                        </div>
                        <button onclick="addToCart(${p.id})" class="w-full py-2 bg-slate-900 hover:bg-brand-primary text-white text-xs font-extrabold rounded-xl transition-all flex items-center justify-center gap-1.5 shadow-sm">
                            <i class="fa-solid fa-plus text-[10px]"></i> Add To Cart
                        </button>
                    </div>
                </div>
            `).join("");
        }

        function toggleCart() {
            document.getElementById("cartModal").classList.toggle("hidden");
        }

        function addToCart(id) {
            const prod = products.find(p => p.id === id);
            const found = cart.find(c => c.id === id);
            if (found) found.qty++;
            else cart.push({ ...prod, qty: 1 });
            updateCart();
            toggleCart();
        }

        function updateCart() {
            document.getElementById("cartBadge").innerText = cart.reduce((a, b) => a + b.qty, 0);
            const total = cart.reduce((a, b) => a + (b.price * b.qty), 0);
            document.getElementById("cartTotal").innerText = `Rs. ${total.toLocaleString()}`;

            const container = document.getElementById("cartItems");
            if (cart.length === 0) {
                container.innerHTML = `<div class="text-center py-16 space-y-3"><i class="fa-solid fa-cart-flatbed text-4xl text-slate-300"></i><p class="text-slate-400 text-xs font-semibold">Your cart is currently empty.</p></div>`;
                return;
            }

            container.innerHTML = cart.map(i => `
                <div class="flex items-center justify-between bg-slate-50 p-3 rounded-xl border border-slate-100">
                    <div class="space-y-0.5">
                        <h5 class="text-xs font-extrabold text-slate-800">${i.title}</h5>
                        <p class="text-[11px] font-semibold text-brand-primary">Rs. ${i.price} x ${i.qty}</p>
                    </div>
                    <span class="text-xs font-black text-slate-900">Rs. ${i.price * i.qty}</span>
                </div>
            `).join("");
        }

        async function processOrder(e) {
            e.preventDefault();
            if (cart.length === 0) return alert("Your cart is empty!");

            const btn = document.getElementById("submitBtn");
            btn.disabled = true;
            btn.innerText = "Processing...";

            const name = document.getElementById("custName").value;
            const phone = document.getElementById("custPhone").value;
            const address = document.getElementById("custAddress").value;
            const total = cart.reduce((a, b) => a + (b.price * b.qty), 0);

            // Direct Save to Supabase DB Table
            const { error } = await db.from('orders').insert([
                { customer_name: name, customer_phone: phone, customer_address: address, order_items: cart, total_amount: total }
            ]);

            btn.disabled = false;
            btn.innerText = "Confirm Order";

            if (error) {
                alert("Something went wrong! Please try again.");
                console.error(error);
            } else {
                alert("🎉 Order Placed Successfully! We will deliver your items soon.");
                cart = [];
                updateCart();
                toggleCart();
                document.getElementById("checkoutForm").reset();
            }
        }

        function handleSearch() {
            const q = document.getElementById("searchInput").value.toLowerCase();
            renderProducts(products.filter(p => p.title.toLowerCase().includes(q)));
        }

        function filterCategory(cat) {
            document.querySelectorAll('.cat-btn').forEach(b => {
                b.classList.remove('bg-brand-dark', 'text-white');
                b.classList.add('bg-white', 'text-slate-600');
            });
            event.target.classList.add('bg-brand-dark', 'text-white');
            event.target.classList.remove('bg-white', 'text-slate-600');

            if (cat === 'All') renderProducts(products);
            else renderProducts(products.filter(p => p.category === cat));
        }
    </script>
</body>
</html>
