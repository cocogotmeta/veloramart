<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache" />
  <title>MAISON ASK — Private Desk</title>
  <link rel="icon" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0b0a08;
      --panel: #14110d;
      --ink: #f3ead8;
      --muted: #b7a78a;
      --line: #3a3328;
      --gold: #c8a96a;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: radial-gradient(1200px 500px at 50% -10%, #2a2318, var(--bg));
      color: var(--ink);
      font-family: Manrope, sans-serif;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 18px 22px 14px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand { font-family: "Cormorant Garamond", serif; font-size: 28px; letter-spacing: 0.08em; margin: 0; }
    .sub { margin: 4px 0 0; color: var(--muted); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; }
    header button, form button {
      background: transparent;
      color: var(--gold);
      border: 1px solid var(--gold);
      padding: 9px 14px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-size: 11px;
      cursor: pointer;
    }
    header button:hover, form button:hover { background: var(--gold); color: #111; }
    #log {
      flex: 1;
      overflow-y: auto;
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .bubble {
      max-width: min(720px, 94%);
      padding: 14px 16px;
      white-space: pre-wrap;
      line-height: 1.55;
      font-size: 16px;
    }
    .bot {
      align-self: flex-start;
      background: #16130f;
      border: 1px solid var(--line);
      font-family: "Cormorant Garamond", serif;
      font-size: 19px;
    }
    .me {
      align-self: flex-end;
      background: #1d1812;
      border: 1px solid var(--gold);
    }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 22px 12px; }
    .chips button {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--line);
      padding: 7px 11px;
      cursor: pointer;
      font-size: 12px;
    }
    form {
      display: flex;
      gap: 8px;
      padding: 14px 22px 18px;
      border-top: 1px solid var(--line);
      background: var(--panel);
    }
    input {
      flex: 1;
      background: #0b0a08;
      color: var(--ink);
      border: 1px solid var(--line);
      padding: 14px;
      font-size: 16px;
      font-family: Manrope, sans-serif;
    }
    input:focus { outline: 1px solid var(--gold); }
  </style>
</head>
<body>
  <header>
    <div>
      <h1 class="brand">MAISON ASK</h1>
      <p class="sub">Private desk · school-safe answers</p>
    </div>
    <button type="button" id="clearBtn">Clear</button>
  </header>
  <div id="log"></div>
  <div class="chips" id="chips"></div>
  <form id="form">
    <input id="input" type="text" placeholder="Ask a question..." autocomplete="off" />
    <button type="submit">Send</button>
  </form>
  <script>
    const logEl = document.getElementById("log");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const chips = document.getElementById("chips");
    const blocked = /\b(sex|sexy|porn|nude|naked|xxx|onlyfans|dating|hookup|kill|murder|suicide|self-harm|bomb|weapon|gun|drug|cocaine|hack into)\b/i;
    const local = [
      { k: ["hello", "hi", "hey", "salam"], a: "Welcome. Ask anything school-safe.\nTry: What is JavaScript? Who was Quaid-e-Azam? What is gravity?" },
      { k: ["what is html", "html"], a: "HTML is the structure of a web page. Tags mark headings, text, links, images, and buttons.\n<h1>Title</h1>\n<p>Hello</p>" },
      { k: ["what is css", "css"], a: "CSS is style: color, type, space, layout.\nh1 { color: #c8a96a; text-align: center; }" },
      { k: ["what is javascript", "javascript", "what is js"], a: "JavaScript adds behavior: clicks, numbers, showing and hiding parts of a page.\nalert(\"Hello\");" },
      { k: ["python"], a: "Python is a clear language for school programs and later data work.\nprint(\"Hello\")" },
      { k: ["variable"], a: "A variable stores a value.\nJavaScript: let score = 10;\nPython: score = 10" },
      { k: ["loop"], a: "A loop repeats steps.\nfor (let i = 1; i <= 5; i++) { console.log(i); }" },
      { k: ["function"], a: "A function is a named set of steps you can reuse.\nfunction add(a, b) { return a + b; }" },
      { k: ["git", "github"], a: "Git saves versions. GitHub hosts the project online. GitHub Pages can publish a static site." },
      { k: ["who are you"], a: "Maison Ask. I answer coding questions from a built-in desk, and look up other public facts." }
    ];

    function add(who, text) {
      const el = document.createElement("div");
      el.className = "bubble " + who;
      el.textContent = text;
      logEl.appendChild(el);
      logEl.scrollTop = logEl.scrollHeight;
      return el;
    }
    function clean(q) { return q.toLowerCase().replace(/[?!.,]/g, " ").replace(/\s+/g, " ").trim(); }
    function localAnswer(q) {
      const s = " " + clean(q) + " ";
      let best = null, n = 0;
      local.forEach(function (row) {
        row.k.forEach(function (k) {
          if (s.indexOf(k) !== -1 && k.length >= n) { best = row; n = k.length; }
        });
      });
      return best && n >= 3 ? best.a : null;
    }
    function mathAnswer(q) {
      const t = q.replace(/what is|calculate|equals|=/gi, "").trim();
      if (!/^[0-9+\-*/().%\s]+$/.test(t) || !/[0-9]/.test(t) || t.length > 40) return null;
      try {
        const val = Function('"use strict"; return (' + t + ")")();
        if (typeof val === "number" && isFinite(val)) return t + " = " + val;
      } catch (e) {}
      return null;
    }
    async function wikiAnswer(q) {
      const searchUrl = "https://en.wikipedia.org/w/api.php?action=query&list=search&format=json&origin=*&srlimit=1&srsearch=" + encodeURIComponent(q);
      const sData = await (await fetch(searchUrl)).json();
      const hit = sData && sData.query && sData.query.search && sData.query.search[0];
      if (!hit) return null;
      const p = await (await fetch("https://en.wikipedia.org/api/rest_v1/page/summary/" + encodeURIComponent(hit.title))).json();
      if (p.type === "disambiguation") return hit.title + " has more than one meaning. Ask more specifically.";
      return p.extract || null;
    }
    async function reply(q) {
      if (blocked.test(q)) return "That topic is not available.";
      const math = mathAnswer(q);
      if (math) return math;
      const loc = localAnswer(q);
      const wait = add("bot", "One moment.");
      try {
        const wiki = await wikiAnswer(q);
        wait.remove();
        if (wiki && wiki.length > 40) return wiki;
        if (loc) return loc;
        if (wiki) return wiki;
        return "No clear public fact found. Try a shorter question.";
      } catch (e) {
        wait.remove();
        return loc || "Lookup failed. Coding questions still work.";
      }
    }
    async function send(text) {
      add("me", text);
      add("bot", await reply(text));
    }
    [["HTML", "What is HTML?"], ["JavaScript", "What is JavaScript?"], ["Python", "What is Python?"], ["Pakistan", "What is Pakistan?"], ["Gravity", "What is gravity?"], ["Iqbal", "Who was Allama Iqbal?"]].forEach(function (c) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = c[0];
      b.onclick = function () { send(c[1]); };
      chips.appendChild(b);
    });
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      const t = input.value.trim();
      if (!t) return;
      input.value = "";
      send(t);
    });
    document.getElementById("clearBtn").onclick = function () {
      logEl.innerHTML = "";
      add("bot", "The desk is clear. Ask a question.");
    };
    add("bot", "Maison Ask is ready.\nAsk a coding question or a public fact.\nA key does not belong in a public GitHub page.");
  </script>
</body>
</html>
