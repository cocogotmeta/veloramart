<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VELORA MALL | Premium Shopping Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #F4F4F7; color: #1E293B; }
        .hide-scroll::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col justify-between">

    <!-- Top Announcement Bar -->
    <div class="bg-slate-900 text-slate-200 text-[11px] font-bold py-2 px-4 text-center tracking-wide flex items-center justify-center gap-3">
        <span>⚡ VELORA MEGA MALL • CASH ON DELIVERY AVAILABLE NATIONWIDE</span>
    </div>

    <!-- Header / Search Bar (Daraz Style) -->
    <header class="sticky top-0 z-40 bg-white border-b border-slate-200 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3.5 flex items-center justify-between gap-4">
            <!-- Brand Logo -->
            <a href="#" class="flex items-center gap-2">
                <div class="w-10 h-10 rounded-xl bg-orange-600 text-white flex items-center justify-center text-xl font-black">
                    <i class="fa-solid fa-store"></i>
                </div>
                <div class="leading-none">
                    <span class="font-extrabold text-xl tracking-tight text-slate-900">VELORA</span>
                    <span class="text-[10px] font-bold text-orange-600 block uppercase tracking-widest">Mall</span>
                </div>
            </a>

            <!-- Search Bar -->
            <div class="flex-1 max-w-2xl mx-2">
                <div class="relative flex items-center">
                    <input type="text" id="searchInput" oninput="handleSearch()" placeholder="Search in Velora Mall (e.g., Headphones, Trimmers, Hoodies...)" 
                        class="w-full bg-slate-100 border border-slate-300 rounded-xl py-2.5 pl-4 pr-12 text-xs font-medium text-slate-800 placeholder-slate-400 focus:outline-none focus:bg-white focus:border-orange-500 transition-all">
                    <button class="absolute right-1 px-4 py-1.5 bg-orange-600 hover:bg-orange-700 rounded-lg text-white text-xs font-bold transition-all">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </button>
                </div>
            </div>

            <!-- Cart Trigger -->
            <button onclick="toggleCart()" class="relative flex items-center gap-2 bg-slate-100 hover:bg-slate-200 px-4 py-2.5 rounded-xl text-xs font-bold text-slate-800 transition-all border border-slate-200">
                <i class="fa-solid fa-cart-shopping text-orange-600 text-sm"></i>
                <span class="hidden sm:inline">Cart</span>
                <span id="cartBadge" class="bg-orange-600 text-white text-[10px] font-black rounded-full h-5 w-5 flex items-center justify-center">0</span>
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 py-6 space-y-6 flex-1 w-full">

        <!-- Daraz Category Quick Icons -->
        <div class="grid grid-cols-4 sm:grid-cols-8 gap-3 bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm text-center">
            <button onclick="filterCategory('All')" class="flex flex-col items-center gap-2 group">
                <div class="w-12 h-12 rounded-2xl bg-orange-50 text-orange-600 flex items-center justify-center text-lg group-hover:bg-orange-600 group-hover:text-white transition-all">
                    <i class="fa-solid fa-border-all"></i>
                </div>
                <span class="text-[11px] font-bold text-slate-700">All Items</span>
            </button>
            <button onclick="filterCategory('Electronics')" class="flex flex-col items-center gap-2 group">
                <div class="w-12 h-12 rounded-2xl bg-blue-50 text-blue-600 flex items-center justify-center text-lg group-hover:bg-blue-600 group-hover:text-white transition-all">
                    <i class="fa-solid fa-mobile-screen-button"></i>
                </div>
                <span class="text-[11px] font-bold text-slate-700">Gadgets</span>
            </button>
            <button onclick="filterCategory('Grooming')" class="flex flex-col items-center gap-2 group">
                <div class="w-12 h-12 rounded-2xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-lg group-hover:bg-emerald-600 group-hover:text-white transition-all">
                    <i class="fa-solid fa-scissors"></i>
                </div>
                <span class="text-[11px] font-bold text-slate-700">Grooming</span>
            </button>
            <button onclick="filterCategory('Fashion')" class="flex flex-col items-center gap-2 group">
                <div class="w-12 h-12 rounded-2xl bg-purple-50 text-purple-600 flex items-center justify-center text-lg group-hover:bg-purple-600 group-hover:text-white transition-all">
                    <i class="fa-solid fa-shirt"></i>
                </div>
                <span class="text-[11px] font-bold text-slate-700">Fashion</span>
            </button>
            <button onclick="filterCategory('Electronics')" class="flex flex-col items-center gap-2 group">
                <div class="w-12 h-12 rounded-2xl bg-amber-50 text-amber-600 flex items-center justify-center text-lg group-hover:bg-amber-600 group-hover:text-white transition-all">
                    <i class="fa-solid fa-headphones"></i>
                </div>
                <span class="text-[11px] font-bold text-slate-700">Audio</span>
            </button>
            <button onclick="filterCategory('Grooming')" class="flex flex-col items-center gap-2 group">
                <div class="w-12 h-12 rounded-2xl bg-rose-50 text-rose-600 flex items-center justify-center text-lg group-hover:bg-rose-600 group-hover:text-white transition-all">
                    <i class="fa-solid fa-spray-can"></i>
                </div>
                <span class="text-[11px] font-bold text-slate-700">Perfumes</span>
            </button>
            <button onclick="filterCategory('Fashion')" class="flex flex-col items-center gap-2 group">
                <div class="w-12 h-12 rounded-2xl bg-indigo-50 text-indigo-600 flex items-center justify-center text-lg group-hover:bg-indigo-600 group-hover:text-white transition-all">
                    <i class="fa-solid fa-wallet"></i>
                </div>
                <span class="text-[11px] font-bold text-slate-700">Wallets</span>
            </button>
            <button onclick="filterCategory('Electronics')" class="flex flex-col items-center gap-2 group">
                <div class="w-12 h-12 rounded-2xl bg-teal-50 text-teal-600 flex items-center justify-center text-lg group-hover:bg-teal-600 group-hover:text-white transition-all">
                    <i class="fa-solid fa-clock"></i>
                </div>
                <span class="text-[11px] font-bold text-slate-700">Watches</span>
            </button>
        </div>

        <!-- Flash Sale Section Header (Daraz Vibe) -->
        <div class="bg-white rounded-2xl p-4 border border-slate-200/80 shadow-sm flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <span class="text-xs font-black bg-orange-600 text-white px-3 py-1 rounded-lg uppercase tracking-wider">Flash Sale</span>
                <span class="text-xs font-bold text-slate-600 hidden sm:inline">On Sale Right Now</span>
            </div>
            <div class="flex items-center gap-2 text-xs font-mono font-bold text-slate-700">
                <span>Ending in:</span>
                <span class="bg-slate-900 text-orange-400 px-2 py-1 rounded">03</span> : 
                <span class="bg-slate-900 text-orange-400 px-2 py-1 rounded">45</span> : 
                <span class="bg-slate-900 text-orange-400 px-2 py-1 rounded">12</span>
            </div>
        </div>

        <!-- Product Cards Grid (Daraz Multi-Vendor Style) -->
        <div id="productsGrid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3 sm:gap-4">
            <!-- Dynamic Injected Items -->
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-6 mt-8">
        <div class="max-w-7xl mx-auto px-4 text-center text-xs text-slate-500 font-medium">
            <p>&copy; 2026 VELORA Mall. Verified Merchant Store.</p>
        </div>
    </footer>

    <!-- Quick View Modal -->
    <div id="quickViewModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-xl w-full p-6 relative space-y-4 shadow-2xl">
            <button onclick="closeQuickView()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-900"><i class="fa-solid fa-xmark text-lg"></i></button>
            <div id="quickViewContent"></div>
        </div>
    </div>

    <!-- Cart Drawer -->
    <div id="cartModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex justify-end">
        <div class="bg-white w-full max-w-md h-full flex flex-col shadow-2xl">
            <div class="p-4 border-b border-slate-200 flex justify-between items-center bg-slate-50">
                <h3 class="font-bold text-sm text-slate-900 flex items-center gap-2">
                    <i class="fa-solid fa-bag-shopping text-orange-600"></i> My Cart
                </h3>
                <button onclick="toggleCart()" class="text-slate-400 hover:text-slate-900"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>

            <div id="cartItems" class="flex-1 overflow-y-auto p-4 space-y-3"></div>

            <div class="p-4 border-t border-slate-200 bg-slate-50 space-y-3">
                <div class="flex justify-between font-extrabold text-slate-900 text-sm">
                    <span>Total Payable:</span>
                    <span id="cartTotal" class="text-orange-600">Rs. 0</span>
                </div>
                
                <form id="checkoutForm" onsubmit="processOrder(event)" class="space-y-2.5">
                    <input type="text" id="custName" placeholder="Full Name" required class="w-full text-xs p-3 bg-white border border-slate-300 rounded-xl focus:outline-none focus:border-orange-500">
                    <input type="tel" id="custPhone" placeholder="WhatsApp / Phone Number" required class="w-full text-xs p-3 bg-white border border-slate-300 rounded-xl focus:outline-none focus:border-orange-500">
                    <textarea id="custAddress" placeholder="Complete Delivery Address" required class="w-full text-xs p-3 bg-white border border-slate-300 rounded-xl h-16 resize-none focus:outline-none focus:border-orange-500"></textarea>
                    
                    <button type="submit" class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-xs uppercase tracking-wider transition-all flex items-center justify-center gap-2 shadow-md">
                        <i class="fa-brands fa-whatsapp text-base"></i> Place Order via WhatsApp
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script>
        const products = [
            { id: 1, title: "Velora AirBuds Pro ANC Earbuds", category: "Electronics", price: 4999, original_price: 7999, discount: "-38%", rating: "4.9 ★ (120)", image_url: "https://images.unsplash.com/photo-1590658268037-6bf12165a8df?w=800" },
            { id: 2, title: "Chronos OLED Smartwatch Series 9", category: "Electronics", price: 8499, original_price: 12999, discount: "-35%", rating: "5.0 ★ (85)", image_url: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=800" },
            { id: 3, title: "Vintage T9 Metal Barber Trimmer", category: "Grooming", price: 3199, original_price: 4999, discount: "-36%", rating: "4.8 ★ (230)", image_url: "https://images.unsplash.com/photo-1621607512214-68297480165e?w=800" },
            { id: 4, title: "Double Edge Stainless Safety Razor", category: "Grooming", price: 2499, original_price: 3499, discount: "-28%", rating: "4.9 ★ (64)", image_url: "https://images.unsplash.com/photo-1585232351009-aa87416fca90?w=800" },
            { id: 5, title: "Aura EDP Long-Lasting Perfume 100ml", category: "Grooming", price: 4199, original_price: 5999, discount: "-30%", rating: "5.0 ★ (142)", image_url: "https://images.unsplash.com/photo-1523293182086-7651a899d37f?w=800" },
            { id: 6, title: "Heavyweight Fleece Oversized Hoodie", category: "Fashion", price: 5299, original_price: 7499, discount: "-29%", rating: "4.9 ★ (98)", image_url: "https://images.unsplash.com/photo-1556905055-8f358a7a47b2?w=800" },
            { id: 7, title: "Italian Leather Premium Slim Wallet", category: "Fashion", price: 2799, original_price: 3999, discount: "-30%", rating: "4.8 ★ (115)", image_url: "https://images.unsplash.com/photo-1627123424574-724758594e93?w=800" },
            { id: 8, title: "RGB Mechanical Cyber Keyboard", category: "Electronics", price: 8999, original_price: 12500, discount: "-28%", rating: "5.0 ★ (76)", image_url: "https://images.unsplash.com/photo-1587829741301-dc798b83add3?w=800" }
        ];

        let cart = [];

        document.addEventListener("DOMContentLoaded", () => renderProducts(products));

        function renderProducts(items) {
            const grid = document.getElementById("productsGrid");
            grid.innerHTML = items.map(p => `
                <div class="bg-white rounded-2xl p-3 border border-slate-200/80 hover:border-orange-400 hover:shadow-md transition-all duration-200 flex flex-col justify-between group">
                    <div>
                        <div class="relative h-40 sm:h-48 overflow-hidden rounded-xl mb-2.5 bg-slate-100 cursor-pointer" onclick="openQuickView(${p.id})">
                            <img src="${p.image_url}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
                            <span class="absolute top-2 left-2 bg-orange-600 text-white text-[9px] font-black px-1.5 py-0.5 rounded uppercase">${p.discount}</span>
                        </div>
                        <h4 class="text-xs font-bold text-slate-800 line-clamp-2 leading-snug cursor-pointer hover:text-orange-600 transition-colors" onclick="openQuickView(${p.id})">${p.title}</h4>
                        <div class="text-[10px] text-amber-500 font-bold mt-1">${p.rating}</div>
                    </div>
                    <div class="mt-3 pt-2 border-t border-slate-100">
                        <div class="flex items-baseline gap-1.5 mb-2">
                            <span class="text-sm sm:text-base font-extrabold text-orange-600">Rs. ${p.price.toLocaleString()}</span>
                            <span class="text-[10px] text-slate-400 line-through">Rs. ${p.original_price.toLocaleString()}</span>
                        </div>
                        <button onclick="addToCart(${p.id})" class="w-full py-2 bg-orange-50 hover:bg-orange-600 text-orange-600 hover:text-white border border-orange-200 text-xs font-bold rounded-xl transition-all">
                            Add to Cart
                        </button>
                    </div>
                </div>
            `).join("");
        }

        function openQuickView(id) {
            const p = products.find(x => x.id === id);
            document.getElementById("quickViewContent").innerHTML = `
                <div class="flex flex-col sm:flex-row gap-4">
                    <img src="${p.image_url}" class="w-full sm:w-1/2 h-48 object-cover rounded-xl border border-slate-200">
                    <div class="space-y-3 sm:w-1/2 flex flex-col justify-between">
                        <div>
                            <span class="text-[10px] font-bold text-orange-600 uppercase tracking-widest">${p.category}</span>
                            <h3 class="text-base font-bold text-slate-900 mt-0.5">${p.title}</h3>
                            <p class="text-xs text-slate-500 mt-1">High-quality product with 7-day return guarantee and fast dispatch.</p>
                        </div>
                        <div>
                            <div class="text-lg font-extrabold text-orange-600 mb-3">Rs. ${p.price.toLocaleString()}</div>
                            <button onclick="addToCart(${p.id}); closeQuickView();" class="w-full py-3 bg-orange-600 text-white font-bold text-xs uppercase rounded-xl hover:bg-orange-700 transition-all">
                                Add To Cart
                            </button>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById("quickViewModal").classList.remove("hidden");
        }

        function closeQuickView() { document.getElementById("quickViewModal").classList.add("hidden"); }
        function toggleCart() { document.getElementById("cartModal").classList.toggle("hidden"); }

        function addToCart(id) {
            const prod = products.find(p => p.id === id);
            const found = cart.find(c => c.id === id);
            if (found) found.qty++;
            else cart.push({ ...prod, qty: 1 });
            updateCart();
            toggleCart();
        }

        function updateCart() {
            document.getElementById("cartBadge").innerText = cart.reduce((a, b) => a + b.qty, 0);
            const total = cart.reduce((a, b) => a + (b.price * b.qty), 0);
            document.getElementById("cartTotal").innerText = `Rs. ${total.toLocaleString()}`;

            const container = document.getElementById("cartItems");
            if (cart.length === 0) {
                container.innerHTML = `<div class="text-center py-12 text-slate-400 text-xs">Your cart is empty.</div>`;
                return;
            }

            container.innerHTML = cart.map(i => `
                <div class="flex items-center justify-between bg-slate-50 p-3 rounded-xl border border-slate-200">
                    <div>
                        <h5 class="text-xs font-bold text-slate-800 line-clamp-1">${i.title}</h5>
                        <p class="text-[11px] font-semibold text-orange-600">Rs. ${i.price.toLocaleString()} × ${i.qty}</p>
                    </div>
                    <span class="text-xs font-extrabold text-slate-900">Rs. ${(i.price * i.qty).toLocaleString()}</span>
                </div>
            `).join("");
        }

        function processOrder(e) {
            e.preventDefault();
            if (cart.length === 0) return alert("Your cart is empty!");

            const name = document.getElementById("custName").value;
            const phone = document.getElementById("custPhone").value;
            const address = document.getElementById("custAddress").value;
            const total = cart.reduce((a, b) => a + (b.price * b.qty), 0);

            let orderList = cart.map(i => `• ${i.title} (x${i.qty}) - Rs. ${i.price * i.qty}`).join('\n');
            let message = `*NEW ORDER - VELORA MALL*\n\n*Name:* ${name}\n*Phone:* ${phone}\n*Address:* ${address}\n\n*Items:*\n${orderList}\n\n*Total:* Rs. ${total.toLocaleString()}`;

            window.open(`https://wa.me/923234749637?text=${encodeURIComponent(message)}`, '_blank');
        }

        function handleSearch() {
            const q = document.getElementById("searchInput").value.toLowerCase();
            renderProducts(products.filter(p => p.title.toLowerCase().includes(q) || p.category.toLowerCase().includes(q)));
        }

        function filterCategory(cat) {
            if (cat === 'All') renderProducts(products);
            else renderProducts(products.filter(p => p.category === cat));
        }
    </script>
</body>
</html>
