<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache" />
  <title>ASK</title>
  <link rel="icon" href="favicon.svg" />
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: #000;
      color: #eee;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 16px 18px;
      border-bottom: 1px solid #222;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 { margin: 0; font-size: 18px; font-weight: 700; }
    header p { margin: 4px 0 0; color: #888; font-size: 12px; }
    header button, form button {
      background: #fff;
      color: #000;
      border: 0;
      padding: 10px 14px;
      font-weight: 700;
      cursor: pointer;
    }
    #log {
      flex: 1;
      overflow-y: auto;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .bubble {
      max-width: min(720px, 94%);
      padding: 12px 14px;
      white-space: pre-wrap;
      line-height: 1.5;
      font-size: 16px;
    }
    .bot { align-self: flex-start; background: #111; border: 1px solid #222; }
    .me { align-self: flex-end; background: #1a1a1a; border: 1px solid #333; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 18px 12px; }
    .chips button {
      background: #000;
      color: #ccc;
      border: 1px solid #333;
      padding: 7px 10px;
      cursor: pointer;
    }
    form {
      display: flex;
      gap: 8px;
      padding: 12px 18px 16px;
      border-top: 1px solid #222;
      background: #000;
    }
    input {
      flex: 1;
      background: #000;
      color: #fff;
      border: 1px solid #333;
      padding: 12px;
      font-size: 16px;
    }
    input:focus { outline: 1px solid #666; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>ASK</h1>
      <p>Black desk · school-safe answers</p>
    </div>
    <button type="button" id="clearBtn">Clear</button>
  </header>
  <div id="log"></div>
  <div class="chips" id="chips"></div>
  <form id="form">
    <input id="input" type="text" placeholder="Ask a question..." autocomplete="off" />
    <button type="submit">Send</button>
  </form>
  <script>
    const logEl = document.getElementById("log");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const chips = document.getElementById("chips");
    const blocked = /\b(sex|sexy|porn|nude|naked|xxx|onlyfans|dating|hookup|kill|murder|suicide|self-harm|bomb|weapon|gun|drug|cocaine|hack into)\b/i;
    const local = [
      { k: ["hello", "hi", "hey", "salam"], a: "Hi. Ask a question.\nExamples: What is JavaScript? Who was Quaid-e-Azam? What is gravity?" },
      { k: ["what is html", "html"], a: "HTML is the structure of a web page.\n<h1>Title</h1>\n<p>Hello</p>" },
      { k: ["what is css", "css"], a: "CSS styles the page.\nh1 { color: white; background: black; }" },
      { k: ["what is javascript", "javascript", "what is js"], a: "JavaScript makes a page interactive.\nalert(\"Hello\");" },
      { k: ["python"], a: "Python is a beginner-friendly language.\nprint(\"Hello\")" },
      { k: ["variable"], a: "A variable stores a value.\nlet score = 10;" },
      { k: ["loop"], a: "A loop repeats work.\nfor (let i = 1; i <= 5; i++) { console.log(i); }" },
      { k: ["function"], a: "A function is reusable steps.\nfunction add(a, b) { return a + b; }" },
      { k: ["git", "github"], a: "Git saves versions. GitHub hosts the code. Pages can publish a static site." },
      { k: ["who are you"], a: "A black-theme site bot. Coding answers plus public facts." }
    ];
    function add(who, text) {
      const el = document.createElement("div");
      el.className = "bubble " + who;
      el.textContent = text;
      logEl.appendChild(el);
      logEl.scrollTop = logEl.scrollHeight;
      return el;
    }
    function clean(q) { return q.toLowerCase().replace(/[?!.,]/g, " ").replace(/\s+/g, " ").trim(); }
    function localAnswer(q) {
      const s = " " + clean(q) + " ";
      let best = null, n = 0;
      local.forEach(function (row) {
        row.k.forEach(function (k) {
          if (s.indexOf(k) !== -1 && k.length >= n) { best = row; n = k.length; }
        });
      });
      return best && n >= 3 ? best.a : null;
    }
    function mathAnswer(q) {
      const t = q.replace(/what is|calculate|equals|=/gi, "").trim();
      if (!/^[0-9+\-*/().%\s]+$/.test(t) || !/[0-9]/.test(t) || t.length > 40) return null;
      try {
        const val = Function('"use strict"; return (' + t + ")")();
        if (typeof val === "number" && isFinite(val)) return t + " = " + val;
      } catch (e) {}
      return null;
    }
    async function wikiAnswer(q) {
      const searchUrl = "https://en.wikipedia.org/w/api.php?action=query&list=search&format=json&origin=*&srlimit=1&srsearch=" + encodeURIComponent(q);
      const sData = await (await fetch(searchUrl)).json();
      const hit = sData && sData.query && sData.query.search && sData.query.search[0];
      if (!hit) return null;
      const p = await (await fetch("https://en.wikipedia.org/api/rest_v1/page/summary/" + encodeURIComponent(hit.title))).json();
      if (p.type === "disambiguation") return hit.title + " has more than one meaning. Ask more specifically.";
      return p.extract || null;
    }
    async function reply(q) {
      if (blocked.test(q)) return "That topic is not available.";
      const math = mathAnswer(q);
      if (math) return math;
      const loc = localAnswer(q);
      const wait = add("bot", "One moment.");
      try {
        const wiki = await wikiAnswer(q);
        wait.remove();
        if (wiki && wiki.length > 40) return wiki;
        if (loc) return loc;
        if (wiki) return wiki;
        return "No clear public fact found. Try a shorter question.";
      } catch (e) {
        wait.remove();
        return loc || "Lookup failed. Coding questions still work.";
      }
    }
    async function send(text) {
      add("me", text);
      add("bot", await reply(text));
    }
    [["HTML", "What is HTML?"], ["JavaScript", "What is JavaScript?"], ["Python", "What is Python?"], ["Pakistan", "What is Pakistan?"], ["Gravity", "What is gravity?"]].forEach(function (c) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = c[0];
      b.onclick = function () { send(c[1]); };
      chips.appendChild(b);
    });
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      const t = input.value.trim();
      if (!t) return;
      input.value = "";
      send(t);
    });
    document.getElementById("clearBtn").onclick = function () {
      logEl.innerHTML = "";
      add("bot", "Clear. Ask a question.");
    };
    add("bot", "Black theme is on.\nAsk a coding question or a public fact.");
  </script>
</body>
</html>
