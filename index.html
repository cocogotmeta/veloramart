<!DOCTYPE html>
<html lang="ur">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Coding AI Bot</title>
  <link rel="icon" href="favicon.svg" />
  <style>
    :root {
      --bg: #0f1210;
      --panel: #171c19;
      --ink: #e8eee6;
      --muted: #9aa89a;
      --line: #2a332c;
      --me: #2d6a4f;
      --bot: #243028;
      --acc: #95d5b2;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    header h1 { margin: 0; font-size: 18px; font-weight: 700; }
    header p { margin: 2px 0 0; color: var(--muted); font-size: 12px; }
    #log {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .bubble {
      max-width: min(720px, 92%);
      padding: 10px 12px;
      white-space: pre-wrap;
      line-height: 1.45;
      font-size: 15px;
      border-radius: 10px;
    }
    .bot { background: var(--bot); align-self: flex-start; }
    .me { background: var(--me); align-self: flex-end; }
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 0 16px 10px;
    }
    .chips button {
      background: var(--panel);
      color: var(--ink);
      border: 1px solid var(--line);
      padding: 7px 10px;
      cursor: pointer;
      font-size: 13px;
    }
    form {
      display: flex;
      gap: 8px;
      padding: 12px 16px 16px;
      border-top: 1px solid var(--line);
      background: var(--panel);
    }
    input {
      flex: 1;
      background: #101410;
      color: var(--ink);
      border: 1px solid var(--line);
      padding: 12px;
      font-size: 16px;
    }
    form button, header button {
      background: var(--acc);
      color: #102016;
      border: 0;
      padding: 12px 16px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Coding AI Bot</h1>
      <p>HTML · CSS · JS · Python · logic · errors · Git</p>
    </div>
    <button type="button" id="clearBtn">Clear</button>
  </header>
  <div id="log"></div>
  <div class="chips" id="chips"></div>
  <form id="form">
    <input id="input" type="text" placeholder="Kuch bhi poocho: loop kya hai, form, python, git..." autocomplete="off" />
    <button type="submit">Send</button>
  </form>
  <script src="bot.js"></script>
</body>
</html>
