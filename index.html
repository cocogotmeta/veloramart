                        <div class="flex items-baseline gap-1.5 mb-2.5">
                            <span class="text-sm sm:text-base font-black text-amber-400">Rs. ${p.price.toLocaleString()}</span>
                            <span class="text-[10px] text-slate-500 line-through">Rs. ${p.original_price.toLocaleString()}</span>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="openQuickView(${p.id})" class="px-3 py-2 bg-white/10 hover:bg-white/20 text-white text-xs font-bold rounded-xl transition-all" title="View Details">
                                <i class="fa-solid fa-eye"></i>
                            </button>
                            <button onclick="addToCart(${p.id})" class="flex-1 py-2 gold-glow-btn text-slate-950 text-xs font-extrabold rounded-xl transition-all">
                                Add to Cart
                            </button>
                        </div>
                    </div>
                </div>
            `).join("");
        }

        function openQuickView(id) {
            const p = products.find(x => x.id === id);
            document.getElementById("quickViewContent").innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="space-y-3">
                        <div class="h-64 sm:h-72 rounded-2xl overflow-hidden bg-white/5 border border-white/10">
                            <img id="mainGalleryImg" src="${p.images[0]}" class="w-full h-full object-cover transition-all duration-300">
                        </div>
                        <div class="flex gap-2 overflow-x-auto pb-1">
                            ${p.images.map((img) => `
                                <button onclick="switchImage('${img}')" class="w-16 h-16 rounded-xl border border-white/15 hover:border-amber-400 overflow-hidden flex-shrink-0 transition-all">
                                    <img src="${img}" class="w-full h-full object-cover">
                                </button>
                            `).join('')}
                        </div>
                    </div>

                    <div class="space-y-4 flex flex-col justify-between">
                        <div>
                            <div class="flex items-center justify-between">
                                <span class="text-[10px] font-black text-amber-400 uppercase tracking-widest bg-amber-500/10 border border-amber-500/20 px-2.5 py-1 rounded-lg">${p.category}</span>
                                <span class="text-[10px] font-bold text-emerald-400 bg-emerald-500/10 border border-emerald-500/20 px-2.5 py-1 rounded-lg">${p.stock}</span>
                            </div>
                            <h3 class="text-base sm:text-lg font-bold text-white mt-2 leading-snug">${p.title}</h3>
                            <div class="text-xs font-bold text-amber-400 mt-1">${p.rating}</div>
                            
                            <p class="text-xs text-slate-300 mt-3 leading-relaxed">${p.description}</p>
                            
                            <div class="mt-4 space-y-2">
                                <span class="text-[10px] font-black uppercase text-slate-400 tracking-wider">Specifications:</span>
                                <ul class="space-y-1">
                                    ${p.features.map(f => `<li class="text-xs font-medium text-slate-200 flex items-center gap-2"><i class="fa-solid fa-circle-check text-amber-400 text-[10px]"></i> ${f}</li>`).join('')}
                                </ul>
                            </div>
                        </div>

                        <div class="pt-4 border-t border-white/10">
                            <div class="flex items-baseline gap-2 mb-3">
                                <span class="text-2xl font-black text-amber-400">Rs. ${p.price.toLocaleString()}</span>
                                <span class="text-xs text-slate-500 line-through">Rs. ${p.original_price.toLocaleString()}</span>
                                <span class="text-xs font-black text-amber-400 bg-amber-500/10 border border-amber-500/30 px-2 py-0.5 rounded">${p.discount} OFF</span>
                            </div>
                            <button onclick="addToCart(${p.id}); closeQuickView();" class="w-full py-3.5 gold-glow-btn text-slate-950 font-black text-xs uppercase tracking-wider rounded-xl transition-all flex items-center justify-center gap-2">
                                <i class="fa-solid fa-bag-shopping"></i> Add To Bag
                            </button>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById("quickViewModal").classList.remove("hidden");
        }

        function switchImage(src) { document.getElementById("mainGalleryImg").src = src; }
        function closeQuickView() { document.getElementById("quickViewModal").classList.add("hidden"); }
        function toggleCart() { document.getElementById("cartModal").classList.toggle("hidden"); }

        function addToCart(id) {
            const prod = products.find(p => p.id === id);
            const found = cart.find(c => c.id === id);
            if (found) found.qty++;
            else cart.push({ ...prod, qty: 1 });
            updateCart();
            toggleCart();
        }

        function updateCart() {
            document.getElementById("cartBadge").innerText = cart.reduce((a, b) => a + b.qty, 0);
            const total = cart.reduce((a, b) => a + (b.price * b.qty), 0);
            document.getElementById("cartTotal").innerText = `Rs. ${total.toLocaleString()}`;

            const container = document.getElementById("cartItems");
            if (cart.length === 0) {
                container.innerHTML = `<div class="text-center py-12 text-slate-500 text-xs">Your shopping bag is empty.</div>`;
                return;
            }

            container.innerHTML = cart.map(i => `
                <div class="flex items-center justify-between bg-white/5 p-3 rounded-2xl border border-white/10">
                    <div>
                        <h5 class="text-xs font-bold text-white line-clamp-1">${i.title}</h5>
                        <p class="text-[11px] font-semibold text-amber-400">Rs. ${i.price.toLocaleString()} × ${i.qty}</p>
                    </div>
                    <span class="text-xs font-black text-white">Rs. ${(i.price * i.qty).toLocaleString()}</span>
                </div>
            `).join("");
        }

        function processOrder(e) {
            e.preventDefault();
            if (cart.length === 0) return alert("Cart empty hai!");

            const name = document.getElementById("custName").value;
            const phone = document.getElementById("custPhone").value;
            const address = document.getElementById("custAddress").value;
            const total = cart.reduce((a, b) => a + (b.price * b.qty), 0);

            let orderList = cart.map(i => `• ${i.title} (x${i.qty}) - Rs. ${i.price * i.qty}`).join('\n');
            let message = `*AETHER LUXURY STORE ORDER*\n\n*Name:* ${name}\n*Phone:* ${phone}\n*Address:* ${address}\n\n*Items:*\n${orderList}\n\n*Total Payable:* Rs. ${total.toLocaleString()}`;

            window.open(`https://wa.me/923234749637?text=${encodeURIComponent(message)}`, '_blank');
        }

        function handleSearch() {
            const q = document.getElementById("searchInput").value.toLowerCase();
            renderProducts(products.filter(p => p.title.toLowerCase().includes(q) || p.category.toLowerCase().includes(q)));
        }

        function filterCategory(cat) {
            if (cat === 'All') renderProducts(products);
            else renderProducts(products.filter(p => p.category.toLowerCase() === cat.toLowerCase()));
        }
    </script>
</body>
</html>
