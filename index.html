<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VELORA | Liquid Glass Luxury Flagship</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        glass: {
                            base: '#030712',
                            card: 'rgba(17, 24, 39, 0.45)',
                            border: 'rgba(255, 255, 255, 0.12)',
                            glow: '#6366F1',
                            cyan: '#06B6D4',
                            magenta: '#EC4899',
                            gold: '#F59E0B'
                        }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        display: ['Space Grotesk', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #030712;
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.18) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(236, 72, 153, 0.15) 0px, transparent 50%),
                radial-gradient(at 50% 100%, rgba(6, 182, 212, 0.15) 0px, transparent 50%);
            background-attachment: fixed;
        }

        .liquid-glass {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.02) 100%);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 
                0 20px 50px rgba(0, 0, 0, 0.5),
                inset 0 1px 1px rgba(255, 255, 255, 0.3),
                inset 0 -1px 1px rgba(0, 0, 0, 0.5);
        }

        .liquid-glass:hover {
            border-color: rgba(255, 255, 255, 0.35);
            box-shadow: 
                0 30px 60px rgba(99, 102, 241, 0.25),
                inset 0 1px 2px rgba(255, 255, 255, 0.5);
            transform: translateY(-8px) scale(1.01);
        }

        .glass-input {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .glass-input:focus {
            border-color: #6366F1;
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.4);
        }

        .text-glow {
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }

        .hide-scroll::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="text-slate-100 font-sans antialiased selection:bg-indigo-500 selection:text-white min-h-screen">

    <!-- Glowing Background Spheres -->
    <div class="fixed top-20 left-10 w-96 h-96 bg-indigo-600/20 rounded-full blur-[120px] pointer-events-none -z-10 animate-pulse"></div>
    <div class="fixed bottom-10 right-10 w-[30rem] h-[30rem] bg-pink-600/15 rounded-full blur-[140px] pointer-events-none -z-10"></div>

    <!-- Ticker -->
    <div class="bg-slate-950/80 backdrop-blur-md text-slate-300 text-[10px] font-extrabold py-2 px-4 text-center border-b border-white/10 tracking-[0.2em] uppercase">
        ⚡ FREE EXPRESS DELIVERY NATIONWIDE • CASH ON DELIVERY AVAILABLE ⚡
    </div>

    <!-- Liquid Navbar -->
    <header class="sticky top-0 z-40 bg-slate-950/40 backdrop-blur-2xl border-b border-white/10">
        <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between gap-6">
            <a href="#" class="flex items-center gap-3 group">
                <div class="w-11 h-11 rounded-2xl liquid-glass flex items-center justify-center text-indigo-400 group-hover:text-pink-400 transition-colors">
                    <i class="fa-solid fa-cube text-lg"></i>
                </div>
                <span class="font-display text-2xl font-black tracking-wider bg-gradient-to-r from-white via-slate-200 to-indigo-300 bg-clip-text text-transparent">VELORA<span class="text-pink-500">.</span></span>
            </a>

            <!-- Search -->
            <div class="flex-1 max-w-md hidden md:block">
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                    <input type="text" id="searchInput" oninput="handleSearch()" placeholder="Search liquid glass tech, grooming..." 
                        class="w-full glass-input rounded-full py-2.5 pl-11 pr-4 text-xs font-medium text-slate-100 placeholder-slate-400 focus:outline-none transition-all">
                </div>
            </div>

            <!-- Cart Trigger -->
            <button onclick="toggleCart()" class="relative flex items-center gap-3 liquid-glass px-6 py-2.5 rounded-full font-bold text-xs transition-all">
                <i class="fa-solid fa-bag-shopping text-indigo-400 text-sm"></i>
                <span class="tracking-wider">CART</span>
                <span id="cartBadge" class="bg-pink-500 text-white text-[10px] font-black rounded-full h-5 w-5 flex items-center justify-center shadow-lg shadow-pink-500/50">0</span>
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-6 py-10 space-y-12">
        
        <!-- Hero Liquid Glass Banner -->
        <div class="relative rounded-3xl overflow-hidden liquid-glass p-8 sm:p-14 border border-white/20">
            <div class="relative z-10 max-w-2xl space-y-5">
                <span class="inline-flex items-center gap-2 bg-indigo-500/10 border border-indigo-400/30 text-indigo-300 text-[10px] font-extrabold px-4 py-1.5 rounded-full uppercase tracking-widest backdrop-blur-xl">
                    <i class="fa-solid fa-bolt text-pink-400"></i> Liquid Glass Edition 2026
                </span>
                <h1 class="font-display text-4xl sm:text-6xl font-black text-white leading-tight text-glow">Future-Grade Luxury Essentials.</h1>
                <p class="text-slate-300 text-xs sm:text-sm leading-relaxed tracking-wide font-light">Next-gen cyber electronics, barber-grade grooming gear, and urban streetwear. Crafted for ultimate precision.</p>
            </div>
        </div>

        <!-- Filter Categories -->
        <div class="flex items-center gap-3 overflow-x-auto pb-2 hide-scroll">
            <button onclick="filterCategory('All')" class="cat-btn active bg-indigo-600 text-white text-xs font-black px-6 py-3 rounded-full whitespace-nowrap tracking-wider uppercase transition-all shadow-lg shadow-indigo-600/40">All Collections</button>
            <button onclick="filterCategory('Electronics')" class="cat-btn liquid-glass text-slate-300 hover:text-white text-xs font-bold px-6 py-3 rounded-full whitespace-nowrap tracking-wider uppercase transition-all">Electronics</button>
            <button onclick="filterCategory('Grooming')" class="cat-btn liquid-glass text-slate-300 hover:text-white text-xs font-bold px-6 py-3 rounded-full whitespace-nowrap tracking-wider uppercase transition-all">Grooming</button>
            <button onclick="filterCategory('Fashion')" class="cat-btn liquid-glass text-slate-300 hover:text-white text-xs font-bold px-6 py-3 rounded-full whitespace-nowrap tracking-wider uppercase transition-all">Apparel</button>
        </div>

        <!-- Products Grid -->
        <div id="productsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- Dynamic Injection -->
        </div>

    </main>

    <!-- Quick View Modal -->
    <div id="quickViewModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-2xl z-50 hidden flex items-center justify-center p-4">
        <div class="liquid-glass rounded-3xl max-w-2xl w-full p-8 relative shadow-2xl space-y-6 border border-white/20">
            <button onclick="closeQuickView()" class="absolute top-6 right-6 text-slate-400 hover:text-white text-xl"><i class="fa-solid fa-xmark"></i></button>
            <div id="quickViewContent"></div>
        </div>
    </div>

    <!-- Cart Drawer -->
    <div id="cartModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-2xl z-50 hidden flex justify-end">
        <div class="liquid-glass border-l border-white/20 w-full max-w-md h-full flex flex-col shadow-2xl">
            <div class="p-6 bg-slate-950/60 border-b border-white/10 flex justify-between items-center">
                <h3 class="font-display font-bold text-lg text-white flex items-center gap-3">
                    <i class="fa-solid fa-bag-shopping text-pink-400"></i> Shopping Bag
                </h3>
                <button onclick="toggleCart()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>

            <div id="cartItems" class="flex-1 overflow-y-auto p-6 space-y-4"></div>

            <div class="p-6 border-t border-white/10 bg-slate-950/80 space-y-5">
                <div class="flex justify-between font-black text-white text-lg">
                    <span>Total Amount:</span>
                    <span id="cartTotal" class="text-pink-400 font-display">Rs. 0</span>
                </div>
                
                <form id="checkoutForm" onsubmit="processOrder(event)" class="space-y-3.5">
                    <input type="text" id="custName" placeholder="Full Name" required class="w-full text-xs p-4 glass-input text-white rounded-xl focus:outline-none transition-all">
                    <input type="tel" id="custPhone" placeholder="Phone / WhatsApp Number" required class="w-full text-xs p-4 glass-input text-white rounded-xl focus:outline-none transition-all">
                    <textarea id="custAddress" placeholder="Complete Delivery Address" required class="w-full text-xs p-4 glass-input text-white rounded-xl focus:outline-none h-20 resize-none transition-all"></textarea>
                    
                    <button type="submit" class="w-full py-4 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-white font-black rounded-xl text-xs uppercase tracking-widest shadow-xl shadow-emerald-500/20 transition-all flex items-center justify-center gap-2">
                        <i class="fa-brands fa-whatsapp text-lg"></i> Confirm Order On WhatsApp
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script>
        const products = [
            { id: 1, title: "Velora Phantom ANC TWS Earbuds (Glass Edition)", category: "Electronics", price: 4999, original_price: 7500, discount: "33% OFF", tag: "Cyber Glass", rating: "5.0 ★", image_url: "https://images.unsplash.com/photo-1590658268037-6bf12165a8df?w=800" },
            { id: 2, title: "Chronos Ultra Series 9 Smartwatch (Glass Frame)", category: "Electronics", price: 8500, original_price: 12000, discount: "29% OFF", tag: "Ultra OLED", rating: "4.9 ★", image_url: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=800" },
            { id: 3, title: "Vintage T9 Barber Metal Clipper (Gold Finish)", category: "Grooming", price: 3200, original_price: 4500, discount: "28% OFF", tag: "Barber Pro", rating: "5.0 ★", image_url: "https://images.unsplash.com/photo-1621607512214-68297480165e?w=800" },
            { id: 4, title: "Double-Edge Safety Razor Handle (Stainless Steel)", category: "Grooming", price: 2499, original_price: 3500, discount: "28% OFF", tag: "Classic", rating: "4.8 ★", image_url: "https://images.unsplash.com/photo-1585232351009-aa87416fca90?w=800" },
            { id: 5, title: "Aura Noir EDP Luxury Perfume 100ml", category: "Grooming", price: 4200, original_price: 6000, discount: "30% OFF", tag: "Premium", rating: "5.0 ★", image_url: "https://images.unsplash.com/photo-1523293182086-7651a899d37f?w=800" },
            { id: 6, title: "Heavyweight Urban Fleece Hoodie (450 GSM)", category: "Fashion", price: 5499, original_price: 7999, discount: "31% OFF", tag: "Streetwear", rating: "4.9 ★", image_url: "https://images.unsplash.com/photo-1556905055-8f358a7a47b2?w=800" },
            { id: 7, title: "Italian Handcrafted Leather Bifold Wallet", category: "Fashion", price: 2800, original_price: 4000, discount: "30% OFF", tag: "Pure Leather", rating: "4.9 ★", image_url: "https://images.unsplash.com/photo-1627123424574-724758594e93?w=800" },
            { id: 8, title: "RGB Mechanical Gaming Keyboard (Aircraft Aluminum)", category: "Electronics", price: 9200, original_price: 13500, discount: "31% OFF", tag: "Mechanical", rating: "5.0 ★", image_url: "https://images.unsplash.com/photo-1587829741301-dc798b83add3?w=800" },
            { id: 9, title: "Obsidian Black Polarized UV400 Sunglasses", category: "Fashion", price: 2999, original_price: 4200, discount: "28% OFF", tag: "UV400", rating: "4.7 ★", image_url: "https://images.unsplash.com/photo-1511499767150-a48a237f0083?w=800" }
        ];

        let cart = [];

        document.addEventListener("DOMContentLoaded", () => {
            renderProducts(products);
        });

        function renderProducts(items) {
            const grid = document.getElementById("productsGrid");
            grid.innerHTML = items.map(p => `
                <div class="liquid-glass rounded-3xl p-5 transition-all duration-500 group flex flex-col justify-between">
                    <div>
                        <div class="relative h-60 overflow-hidden rounded-2xl mb-4 bg-slate-950/40 cursor-pointer" onclick="openQuickView(${p.id})">
                            <img src="${p.image_url}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700">
                            <span class="absolute top-3 left-3 bg-pink-500/80 backdrop-blur-md text-white text-[9px] font-black px-3 py-1 rounded-full uppercase tracking-widest border border-white/20">${p.tag}</span>
                            <span class="absolute bottom-3 right-3 bg-slate-950/80 backdrop-blur-md text-amber-400 text-[10px] font-bold px-2.5 py-1 rounded-lg border border-white/10">${p.rating}</span>
                        </div>
                        <span class="text-[9px] font-extrabold text-indigo-400 uppercase tracking-widest">${p.category}</span>
                        <h4 class="text-sm font-bold text-slate-100 line-clamp-2 mt-1 cursor-pointer hover:text-indigo-300 transition-colors" onclick="openQuickView(${p.id})">${p.title}</h4>
                    </div>
                    <div class="mt-6">
                        <div class="flex items-baseline gap-2 mb-4">
                            <span class="font-display text-xl font-black text-white">Rs. ${p.price.toLocaleString()}</span>
                            <span class="text-xs text-slate-400 line-through">Rs. ${p.original_price.toLocaleString()}</span>
                        </div>
                        <button onclick="addToCart(${p.id})" class="w-full py-3 bg-indigo-600/30 hover:bg-indigo-600 text-white border border-indigo-400/40 hover:border-indigo-400 text-xs font-black rounded-xl transition-all uppercase tracking-widest shadow-lg">
                            Add To Cart
                        </button>
                    </div>
                </div>
            `).join("");
        }

        function openQuickView(id) {
            const p = products.find(x => x.id === id);
            document.getElementById("quickViewContent").innerHTML = `
                <div class="flex flex-col md:flex-row gap-6">
                    <img src="${p.image_url}" class="w-full md:w-1/2 h-64 object-cover rounded-2xl border border-white/10">
                    <div class="space-y-4 md:w-1/2 flex flex-col justify-between">
                        <div>
                            <span class="text-[10px] font-black text-indigo-400 uppercase tracking-widest">${p.category} • ${p.tag}</span>
                            <h3 class="font-display text-xl font-bold text-white mt-1 leading-snug">${p.title}</h3>
                            <p class="text-xs text-slate-300 mt-2 leading-relaxed">Liquid Glass series engineered product with premium durability and sleek aesthetics.</p>
                        </div>
                        <div>
                            <div class="font-display text-2xl font-black text-white mb-4">Rs. ${p.price.toLocaleString()} <span class="text-xs font-sans text-slate-400 line-through">Rs. ${p.original_price.toLocaleString()}</span></div>
                            <button onclick="addToCart(${p.id}); closeQuickView();" class="w-full py-3.5 bg-pink-600 hover:bg-pink-500 text-white font-black text-xs uppercase tracking-widest rounded-xl transition-all shadow-xl shadow-pink-600/30">
                                Add To Shopping Bag
                            </button>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById("quickViewModal").classList.remove("hidden");
        }

        function closeQuickView() {
            document.getElementById("quickViewModal").classList.add("hidden");
        }

        function toggleCart() {
            document.getElementById("cartModal").classList.toggle("hidden");
        }

        function addToCart(id) {
            const prod = products.find(p => p.id === id);
            const found = cart.find(c => c.id === id);
            if (found) found.qty++;
            else cart.push({ ...prod, qty: 1 });
            updateCart();
            toggleCart();
        }

        function updateCart() {
            document.getElementById("cartBadge").innerText = cart.reduce((a, b) => a + b.qty, 0);
            const total = cart.reduce((a, b) => a + (b.price * b.qty), 0);
            document.getElementById("cartTotal").innerText = `Rs. ${total.toLocaleString()}`;

            const container = document.getElementById("cartItems");
            if (cart.length === 0) {
                container.innerHTML = `<div class="text-center py-20 space-y-3"><i class="fa-solid fa-cube text-4xl text-slate-700"></i><p class="text-slate-400 text-xs font-medium tracking-wider">Your glass bag is empty.</p></div>`;
                return;
            }

            container.innerHTML = cart.map(i => `
                <div class="flex items-center justify-between bg-slate-900/60 p-4 rounded-xl border border-white/10">
                    <div class="space-y-1">
                        <h5 class="text-xs font-bold text-slate-200">${i.title}</h5>
                        <p class="text-[11px] font-semibold text-indigo-400">Rs. ${i.price.toLocaleString()} × ${i.qty}</p>
                    </div>
                    <span class="font-display text-xs font-black text-white">Rs. ${(i.price * i.qty).toLocaleString()}</span>
                </div>
            `).join("");
        }

        function processOrder(e) {
            e.preventDefault();
            if (cart.length === 0) return alert("Your cart is empty!");

            const name = document.getElementById("custName").value;
            const phone = document.getElementById("custPhone").value;
            const address = document.getElementById("custAddress").value;
            const total = cart.reduce((a, b) => a + (b.price * b.qty), 0);

            let orderList = cart.map(i => `• ${i.title} (x${i.qty}) - Rs. ${i.price * i.qty}`).join('\n');
            
            let message = `*LIQUID GLASS ORDER - VELORA*\n\n` +
                          `*Customer Name:* ${name}\n` +
                          `*Phone Number:* ${phone}\n` +
                          `*Delivery Address:* ${address}\n\n` +
                          `*Selected Items:*\n${orderList}\n\n` +
                          `*Total Amount:* Rs. ${total.toLocaleString()}`;

            let myNumber = "923234749637"; 
            let whatsappUrl = `https://wa.me/${myNumber}?text=${encodeURIComponent(message)}`;
            
            window.open(whatsappUrl, '_blank');
        }

        function handleSearch() {
            const q = document.getElementById("searchInput").value.toLowerCase();
            renderProducts(products.filter(p => p.title.toLowerCase().includes(q) || p.category.toLowerCase().includes(q)));
        }

        function filterCategory(cat) {
            document.querySelectorAll('.cat-btn').forEach(b => {
                b.classList.remove('bg-indigo-600', 'text-white', 'shadow-lg');
                b.classList.add('liquid-glass', 'text-slate-300');
            });
            event.target.classList.add('bg-indigo-600', 'text-white', 'shadow-lg');
            event.target.classList.remove('liquid-glass', 'text-slate-300');

            if (cat === 'All') renderProducts(products);
            else renderProducts(products.filter(p => p.category === cat));
        }
    </script>
</body>
</html>
